[project]
name = "i2i-slim"
description = "A lightweight version of the custom nodes originally developed by [a/ManglerFTW](https://github.com/ManglerFTW/ComfyI2I) for performing image-to-image tasks in ComfyUI."
version = "1.0.0"
license = {file = "LICENSE"} 
# classifiers = [
#     # For OS-independent nodes (works on all operating systems)
#     "Operating System :: OS Independent",
#
#     # OR for OS-specific nodes, specify the supported systems:
#     "Operating System :: Microsoft :: Windows",  # Windows specific
#     "Operating System :: POSIX :: Linux",  # Linux specific
#     "Operating System :: MacOS",  # macOS specific
#
#     # GPU Accelerator support. Pick the ones that are supported by your extension.
#     "Environment :: GPU :: NVIDIA CUDA",    # NVIDIA CUDA support
#     "Environment :: GPU :: AMD ROCm",       # AMD ROCm support
#     "Environment :: GPU :: Intel Arc",      # Intel Arc support
#     "Environment :: NPU :: Huawei Ascend",  # Huawei Ascend support
#     "Environment :: GPU :: Apple Metal",    # Apple Metal support
# ]

dependencies = ["numpy", "torch", "torchvision", "tensorflow", "scikit-image", "scipy", "opencv-python"]

[project.urls]
Repository = "https://github.com/GeraldWie/ComfyUI-I2I-slim"
#  Used by Comfy Registry https://registry.comfy.org
Documentation = "https://github.com/GeraldWie/ComfyUI-I2I-slim/wiki"
"Bug Tracker" = "https://github.com/GeraldWie/ComfyUI-I2I-slim/issues"

[tool.comfy]
PublisherId = ""
DisplayName = "ComfyUI-I2I-slim"
Icon = ""
includes = [] 
